<!doctype html>
<html lang="ko" data-seed-color-mode="light-only">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VOX-T · 음성 온디바이스 전술 AI</title>
<meta name="theme-color" content="#ffffff">
<script>if(!/\/$|\.html$/.test(location.pathname))location.replace(location.pathname+"/"+location.search+location.hash)</script>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">VOX-T</span><span class="track">T4-2</span></div>
  <div class="chips" aria-live="polite">
    <span class="chip" id="netChip">네트워크 확인 중</span>
    <span class="chip" id="sttChip">음성 인식 대기</span>
    <span class="chip" id="llmChip">LLM 대기</span>
  </div>
</header>

<section class="setup" id="setup">
  <div class="setup-in" role="dialog" aria-labelledby="setupTitle">
    <h1 id="setupTitle">모델 준비</h1>
    <p class="lead">처음 한 번만 이 기기에 저장합니다. 이후 <b>인터넷 없이</b> 동작합니다.</p>
    <div class="opts">
      <label><span>음성 인식</span><select id="sttModel">
        <option value="onnx-community/whisper-small">Whisper small · 약 400MB</option>
        <option value="onnx-community/whisper-base">Whisper base · 약 200MB</option>
      </select></label>
      <label><span>LLM</span><select id="llmModel">
        <option value="Qwen3-4B-q4f16_1-MLC">Qwen3 4B · 약 2.3GB · GPU</option>
        <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen2.5 1.5B · 약 1GB · 저사양</option>
        <option value="">사용 안 함</option>
      </select></label>
      <label><span>연산 장치</span><select id="devicePref">
        <option value="auto">자동 (GPU 우선)</option>
        <option value="wasm">CPU</option>
      </select></label>
    </div>
    <div class="bars">
      <div class="bar"><span>음성 인식</span><em id="sttPct"></em><b class="track-bar"><i id="sttBar"></i></b></div>
      <div class="bar"><span>LLM</span><em id="llmPct"></em><b class="track-bar"><i id="llmBar"></i></b></div>
    </div>
    <button class="btn pri block" id="loadBtn">모델 불러오기</button>
    <p class="hint" id="setupHint"></p>
  </div>
</section>

<main class="stage">
  <figure class="radar-box">
    <svg id="radar" viewBox="-112 -112 224 224" role="img" aria-label="방위·거리 상황도"></svg>
  </figure>

  <section class="now" aria-live="polite">
    <span class="badge" id="confBadge"></span>
    <div id="reportCard"><p class="empty">버튼을 누르고 무전하세요</p></div>
    <div class="readback" id="readback" hidden>
      <p class="rb-text" id="rbText"></p>
      <div class="actions"><button class="btn pri" id="rbOk">맞음 · 확정</button><button class="btn" id="rbFix">정정</button><button class="btn ghost" id="rbSpeak">복창 듣기</button></div>
    </div>
    <div id="sopCard" hidden><div id="sopAns"></div><div class="cites" id="sopCites"></div></div>
  </section>

  <details class="more">
    <summary>상세</summary>
    <div class="more-in">
      <label class="field"><span class="sh">인식 결과</span><textarea id="transcript" rows="3" placeholder="무전 내용"></textarea></label>
      <div class="row"><button class="btn sm" id="reparse">다시 분석</button><span class="stat" id="sttStat"></span></div>
      <label class="tgl"><input type="checkbox" id="radioFx"><span class="sw" aria-hidden="true"></span><span>무전 음질 효과</span></label>
      <p class="sh">시연 샘플</p>
      <div class="samples" id="samples"></div>
      <div id="enCard" hidden><p class="sh">연합군 전달</p><p id="enRule"></p><p class="stat" id="enAi"></p></div>
      <div id="burstCard" hidden><p class="sh">저대역 전송</p><code id="burst"></code><p class="stat" id="bw"></p></div>
      <div class="row log-head"><p class="sh">확정 보고</p><button class="btn sm" id="summaryBtn">상황 요약</button><button class="btn sm" id="export">JSON</button></div>
      <ol class="log" id="log"></ol>
    </div>
  </details>
</main>

<div class="dock">
  <div class="meter" aria-hidden="true"><i id="level"></i></div>
  <button class="ptt" id="ptt" aria-label="누르고 말하기">
    <span class="ring"></span>
    <svg class="mic" viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="2.5" width="6" height="10" rx="3"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5"/></svg>
  </button>
  <p class="ptt-cap"><span class="lbl">누르고 말하기</span><span class="lbl-on">송신 중 · 놓으면 전송</span><span class="lbl-busy">인식 중</span></p>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
